<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Виртуальная экскурсия — Мирский замок</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- id="top" — цель для ссылки «Наверх» в футере -->
    <header id="top">
      <h1>Мирский замок</h1>
      <p>
        Замковый комплекс в городском посёлке Мир Гродненской области — памятник
        поздней готики и ренессанса, объект Всемирного наследия ЮНЕСКО.
      </p>
      <nav>
        <ul>
          <li><a href="#about">Об объекте</a></li>
          <li><a href="#gallery">Галерея</a></li>
          <li><a href="#route">Маршрут</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <!-- СЕКЦИЯ 1: главное изображение через <picture> -->
      <section id="about">
        <h2>Главный объект</h2>
        <figure>
          <picture>
            <!-- на узких экранах отдаём вертикальный кроп -->
            <source
              media="(max-width: 767px)"
              srcset="images/hero-mobile.webp"
              type="image/webp"
            />
            <!-- webp для широких экранов, весит меньше -->
            <source srcset="images/hero.webp" type="image/webp" />
            <!-- запасной вариант, если webp не поддерживается -->
            <img
              src="images/hero.jpg"
              alt="Мирский замок: кирпичные стены с белыми декоративными поясами и угловая башня"
              width="1200"
              height="800"
            />
          </picture>
          <figcaption>
            Южный фасад замка — самая узнаваемая точка съёмки.
          </figcaption>
        </figure>
